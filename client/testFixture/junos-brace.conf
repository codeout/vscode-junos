routing-options {
    rib-groups {
        /* leak into VRF1 */
        RG1 {
            import-rib [ inet.0 VRF1.inet.0 ];
            import-policy PS1;
        }
    }
    interface-routes {
        rib-group inet RG1;
    }
    static {
        route 0.0.0.0/0 next-hop 192.0.2.254;
