        route 10.8.0.0/16 next-table VRF-MISSING.inet.0;
        route 10.7.0.0/16 next-table inet.0;
        route 172.16.0.0/12 next-hop [ 192.0.2.1 192.0.2.2 ];
        route 198.18.0.0/15 {
            next-hop 192.0.2.1;
            preference 200;
        }
    }
}
protocols {
    isis {
        interface ge-0/0/0.0 {
            level 1 metric 10;
            level 2 disable;
        }
    }
    bgp {
        group ibgp {
            type internal;
            import PS1;
            export PS-MISSING;
            export [ PS1 ];
            family inet {
                labeled-unicast {
                    aggregate-label {
                        community C1;
                    }
                }
            }
            neighbor 192.0.2.2;
            neighbor 192.0.2.3 {
                description rr2;
            }
        }
    }
    l2circuit {
        neighbor 192.0.2.2 {
